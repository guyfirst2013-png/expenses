<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הוצאות</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הוצאות">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{margin:0;height:100%;background:#0f3d2e}iframe{border:0;width:100%;height:100%;display:block}</style>
</head><body>
<script>
// ===== הדבק כאן את כתובת ה-/exec של האפליקציה =====
var EXEC = 'https://script.google.com/macros/s/AKfycbzSyQv2tnK5iHOrP3JKzPTDORiUMrhyOM8SpoMC3o_v9N_v_taVQCcuWDZs0dFZ3q1LMw/exec';
// ===== המשתמש נקבע לפי הכתובת: ...?u=guy או ...?u=yaara =====
var u = new URLSearchParams(location.search).get('u') || '';
var f = document.createElement('iframe');
f.src = EXEC + (u ? '?u=' + encodeURIComponent(u) : '');
f.allow = 'clipboard-write';
document.body.appendChild(f);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script></body></html>
